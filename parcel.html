<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parcel — a rectangle puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F6F3FC; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

/*
  PARCEL — a rectangle-division puzzle (a.k.a. "Shikaku").
  Difficulty changes the grid size and how strongly the generator
  favors larger rectangles. A "wrong move" is counted whenever the
  player clears or replaces a rectangle that was not correctly sized
  or positioned at the time.
  NOTE on uniqueness: the generator guarantees at least one valid
  solution exists, not that it's the only one.
*/

const ALLOWED_AREAS = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 16];
const ALLOWED_SET = new Set(ALLOWED_AREAS);

const DIFFICULTIES = {
  Easy: { cols: 9, rows: 7, weightPow: 2.2, cell: 42 },
  Medium: { cols: 11, rows: 9, weightPow: 1.8, cell: 38 },
  Hard: { cols: 13, rows: 11, weightPow: 1.4, cell: 34 },
};

function rnd(n) { return Math.floor(Math.random() * n); }

function generateOnce(cols, rows, weightPow) {
  const free = Array.from({ length: rows }, () => Array(cols).fill(true));
  const pieces = [];

  while (true) {
    let r0 = -1, c0 = -1;
    outer: for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (free[r][c]) { r0 = r; c0 = c; break outer; }
      }
    }
    if (r0 === -1) break;

    let rowMaxW = 0;
    while (c0 + rowMaxW < cols && free[r0][c0 + rowMaxW]) rowMaxW++;
    let colMaxH = 0;
    while (r0 + colMaxH < rows && free[r0 + colMaxH][c0]) colMaxH++;

    const effMaxW = new Array(colMaxH + 1).fill(0);
    let runningMin = rowMaxW;
    for (let h = 1; h <= colMaxH; h++) {
      let w = 0;
      const row = r0 + h - 1;
      while (c0 + w < cols && free[row][c0 + w]) w++;
      runningMin = Math.min(runningMin, w);
      effMaxW[h] = runningMin;
    }

    const candidates = [];
    for (let h = 1; h <= colMaxH; h++) {
      const maxW = effMaxW[h];
      for (let w = 1; w <= maxW; w++) {
        const area = w * h;
        if (ALLOWED_SET.has(area)) candidates.push({ w, h, area });
      }
    }
    if (candidates.length === 0) return null;

    const weights = candidates.map((c) => Math.pow(c.area, weightPow));
    const totalW = weights.reduce((a, b) => a + b, 0);
    let rWeight = Math.random() * totalW;
    let idx = 0;
    for (; idx < candidates.length; idx++) { rWeight -= weights[idx]; if (rWeight <= 0) break; }
    const { w, h } = candidates[Math.min(idx, candidates.length - 1)];

    for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) free[r][c] = false;
    pieces.push({ x: c0, y: r0, w, h, area: w * h });
  }
  return pieces;
}

function generatePieces(cols, rows, weightPow, maxTries = 400) {
  for (let i = 0; i < maxTries; i++) {
    const p = generateOnce(cols, rows, weightPow);
    if (p) return p;
  }
  return null;
}

function makePuzzle(difficultyKey) {
  const cfg = DIFFICULTIES[difficultyKey];
  const pieces = generatePieces(cfg.cols, cfg.rows, cfg.weightPow);
  const clues = pieces.map((p, i) => {
    const clueX = p.x + rnd(p.w);
    const clueY = p.y + rnd(p.h);
    return { id: `c${i}`, clueX, clueY, area: p.area, solution: p };
  });
  return { clues, cols: cfg.cols, rows: cfg.rows, cell: cfg.cell };
}

function colorForIndex(i) {
  const hue = Math.round((i * 137.508) % 360);
  return `hsl(${hue} 68% 70%)`;
}

function rectContainsClue(clue, rect) {
  return (
    clue.clueX >= rect.x && clue.clueX < rect.x + rect.w &&
    clue.clueY >= rect.y && clue.clueY < rect.y + rect.h
  );
}

function isCorrectPlacement(clue, rect) {
  if (!rect) return false;
  return rect.w * rect.h === clue.area && rectContainsClue(clue, rect);
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

// ---------- Fireworks (plain canvas, no external libs) ----------

function Fireworks({ active }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    if (!active) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const resize = () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    const colors = ["#F2555F", "#F2994A", "#F6D860", "#3DCB86", "#5B8DEF", "#7C6FE0", "#E36BAE"];
    let rockets = [];
    let particles = [];
    let running = true;
    let lastBurst = 0;
    const startTime = performance.now();
    const LAUNCH_DURATION = 3200;

    function spawnRocket() {
      const x = canvas.width * (0.15 + Math.random() * 0.7);
      const targetY = canvas.height * (0.15 + Math.random() * 0.35);
      rockets.push({
        x, y: canvas.height, targetY,
        vy: -(7 + Math.random() * 2.5),
        color: colors[Math.floor(Math.random() * colors.length)],
      });
    }

    function explode(x, y, color) {
      const count = 34 + Math.floor(Math.random() * 18);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.25;
        const speed = 1.8 + Math.random() * 3;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.011 + Math.random() * 0.012,
          color,
        });
      }
    }

    function tick(now) {
      if (!running) return;
      const elapsed = now - startTime;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (elapsed < LAUNCH_DURATION && now - lastBurst > 420) {
        spawnRocket();
        lastBurst = now;
      }

      rockets = rockets.filter((r) => {
        r.y += r.vy;
        ctx.beginPath();
        ctx.fillStyle = r.color;
        ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        if (r.y <= r.targetY) {
          explode(r.x, r.y, r.color);
          return false;
        }
        return true;
      });

      particles = particles.filter((p) => {
        p.vy += 0.045;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) return false;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        return true;
      });

      if (elapsed < LAUNCH_DURATION || particles.length > 0 || rockets.length > 0) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    rafRef.current = requestAnimationFrame(tick);

    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener("resize", resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }, [active]);

  return (
    <canvas
      ref={canvasRef}
      style={{
        position: "fixed", top: 0, left: 0, width: "100%", height: "100%",
        pointerEvents: "none", zIndex: 9999,
      }}
    />
  );
}

function Parcel() {
  const [difficulty, setDifficulty] = useState("Medium");
  const [puzzle, setPuzzle] = useState(() => makePuzzle("Medium"));
  const [placements, setPlacements] = useState({});
  const [selectedId, setSelectedId] = useState(null);
  const [pendingCorner, setPendingCorner] = useState(null);
  const [won, setWon] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [wrongMoves, setWrongMoves] = useState(0);
  const [finalTime, setFinalTime] = useState(null);

  const newGame = useCallback((diffKey) => {
    setPuzzle(makePuzzle(diffKey));
    setPlacements({});
    setSelectedId(null);
    setPendingCorner(null);
    setWon(false);
    setElapsed(0);
    setWrongMoves(0);
    setFinalTime(null);
  }, []);

  const { cols: COLS, rows: ROWS, cell: CELL } = puzzle;

  const clueById = useMemo(() => {
    const m = {};
    puzzle.clues.forEach((c) => (m[c.id] = c));
    return m;
  }, [puzzle]);

  const clueColor = useMemo(() => {
    const m = {};
    puzzle.clues.forEach((c, i) => (m[c.id] = colorForIndex(i)));
    return m;
  }, [puzzle]);

  const rectFor = useCallback(
    (clue) => {
      const p = placements[clue.id];
      if (p) return p;
      return { x: clue.clueX, y: clue.clueY, w: 1, h: 1 };
    },
    [placements]
  );

  const coverage = useMemo(() => {
    const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null).map(() => []));
    puzzle.clues.forEach((clue) => {
      const r = rectFor(clue);
      for (let y = r.y; y < r.y + r.h; y++) {
        for (let x = r.x; x < r.x + r.w; x++) {
          if (y >= 0 && y < ROWS && x >= 0 && x < COLS) grid[y][x].push(clue.id);
        }
      }
    });
    return grid;
  }, [puzzle, rectFor, COLS, ROWS]);

  const hasAnyConflict = useMemo(() => {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) if (coverage[r][c].length > 1) return true;
    return false;
  }, [coverage, COLS, ROWS]);

  useEffect(() => {
    if (hasAnyConflict) { setWon(false); return; }
    const allCorrect = puzzle.clues.every((clue) => isCorrectPlacement(clue, placements[clue.id]));
    setWon(allCorrect);
  }, [placements, hasAnyConflict, puzzle]);

  useEffect(() => {
    if (won) setFinalTime((prev) => (prev === null ? elapsed : prev));
    // eslint-disable-next-line
  }, [won]);

  useEffect(() => {
    if (won) return;
    const id = setInterval(() => setElapsed((e) => e + 1), 1000);
    return () => clearInterval(id);
  }, [won, puzzle]);

  const cellClue = useCallback(
    (r, c) => puzzle.clues.find((cl) => cl.clueX === c && cl.clueY === r) || null,
    [puzzle]
  );

  const handleCellClick = (r, c) => {
    const clue = cellClue(r, c);

    if (!selectedId) {
      if (clue) setSelectedId(clue.id);
      return;
    }

    if (clue && clue.id !== selectedId) {
      setSelectedId(clue.id);
      setPendingCorner(null);
      return;
    }

    if (!pendingCorner) {
      setPendingCorner({ r, c });
      return;
    }

    const x0 = Math.min(pendingCorner.c, c);
    const x1 = Math.max(pendingCorner.c, c);
    const y0 = Math.min(pendingCorner.r, r);
    const y1 = Math.max(pendingCorner.r, r);

    const prevRect = placements[selectedId];
    if (!won && prevRect && !isCorrectPlacement(clueById[selectedId], prevRect)) {
      setWrongMoves((wm) => wm + 1);
    }

    setPlacements((prev) => ({
      ...prev,
      [selectedId]: { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 },
    }));
    setPendingCorner(null);
  };

  const clearSelected = () => {
    if (!selectedId) return;
    const existing = placements[selectedId];
    if (!won && existing && !isCorrectPlacement(clueById[selectedId], existing)) {
      setWrongMoves((wm) => wm + 1);
    }
    setPendingCorner(null);
    setPlacements((prev) => {
      const next = { ...prev };
      delete next[selectedId];
      return next;
    });
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") { setSelectedId(null); setPendingCorner(null); }
      if ((e.key === "Backspace" || e.key === "Delete") && selectedId) clearSelected();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
    // eslint-disable-next-line
  }, [selectedId, pendingCorner, placements, won]);

  return (
    <div style={{
      minHeight: "100%", width: "100%", background: "#F6F3FC", color: "#2E2B45",
      fontFamily: "'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      display: "flex", flexDirection: "column", alignItems: "center",
      padding: "28px 14px 44px", boxSizing: "border-box",
    }}>
      <Fireworks active={won} />

      <style>{`
        * { box-sizing: border-box; }
        .pc-btn { cursor: pointer; transition: transform 0.08s ease, filter 0.15s ease; }
        .pc-btn:hover { filter: brightness(1.12); }
        .pc-btn:active { transform: scale(0.97); }
        .pc-cell:focus-visible, .pc-btn:focus-visible { outline: 2px solid #5B8DEF; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { .pc-btn { transition: none !important; } }
        .pc-scroll::-webkit-scrollbar { height: 8px; }
        .pc-scroll::-webkit-scrollbar-thumb { background: #E4E0F5; border-radius: 4px; }
      `}</style>

      <div style={{ textAlign: "center", marginBottom: 18 }}>
        <div style={{ fontFamily: "'Baloo 2', sans-serif", fontWeight: 700, fontSize: 34, letterSpacing: "-0.01em" }}>
          <span style={{ color: "#7C6FE0" }}>Parcel</span>
        </div>
        <div style={{ fontSize: 13, opacity: 0.62, marginTop: 4, maxWidth: 480 }}>
          Divide the grid into rectangles. Each number is how many cells its
          rectangle covers. Every cell belongs to exactly one rectangle.
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap", justifyContent: "center" }}>
        {Object.keys(DIFFICULTIES).map((d) => (
          <button key={d} className="pc-btn" onClick={() => { setDifficulty(d); newGame(d); }} style={{
            padding: "7px 16px", borderRadius: 999, border: "1px solid #E4E0F5",
            background: difficulty === d ? "#7C6FE0" : "#FFFFFF",
            color: difficulty === d ? "#FFFFFF" : "#2E2B45", fontWeight: 700, fontSize: 13,
          }}>{d}</button>
        ))}
      </div>

      <div style={{ fontSize: 11, opacity: 0.5, marginBottom: 10 }}>
        {COLS} × {ROWS} grid — {puzzle.clues.length} rectangles to place
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", justifyContent: "center" }}>
        <div style={{
          padding: "6px 14px", borderRadius: 999, border: "1px solid #E4E0F5",
          background: "#FFFFFF", fontWeight: 700, fontSize: 13,
          display: "flex", alignItems: "center", gap: 6,
        }}>⏱ {formatTime(elapsed)}</div>
        <div style={{
          padding: "6px 14px", borderRadius: 999, border: "1px solid #E4E0F5",
          background: "#FFFFFF", fontWeight: 700, fontSize: 13,
          display: "flex", alignItems: "center", gap: 6,
          color: wrongMoves > 0 ? "#F2555F" : "#2E2B45",
        }}>✗ {wrongMoves} wrong</div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", justifyContent: "center" }}>
        <button className="pc-btn" onClick={() => newGame(difficulty)} style={{
          padding: "7px 16px", borderRadius: 999, border: "1px solid #E4E0F5",
          background: "#FFFFFF", color: "#2E2B45", fontWeight: 600, fontSize: 13,
        }}>New puzzle</button>
        <button className="pc-btn" onClick={clearSelected} disabled={!selectedId} style={{
          padding: "7px 16px", borderRadius: 999, border: "1px solid #E4E0F5",
          background: "#FFFFFF", color: selectedId ? "#2E2B45" : "#B3AFCB",
          fontWeight: 600, fontSize: 13, cursor: selectedId ? "pointer" : "default",
        }}>Clear selected</button>
      </div>

      <div className="pc-scroll" style={{ maxWidth: "100%", overflowX: "auto", padding: 4 }}>
        <div role="grid" aria-label={`${COLS} by ${ROWS} puzzle grid`} style={{
          display: "grid",
          gridTemplateColumns: `repeat(${COLS}, ${CELL}px)`,
          gridTemplateRows: `repeat(${ROWS}, ${CELL}px)`,
          border: "3px solid #3F3B5C", borderRadius: 8, overflow: "hidden",
          boxShadow: won ? "0 0 0 3px #3DCB8666" : "0 8px 20px rgba(63,59,92,0.15)",
        }}>
          {Array.from({ length: ROWS }).map((_, r) =>
            Array.from({ length: COLS }).map((_, c) => {
              const coveringIds = coverage[r][c];
              const conflict = coveringIds.length > 1;
              const coveredBy = coveringIds.length === 1 ? coveringIds[0] : null;
              const clue = cellClue(r, c);
              const isSelected = clue && clue.id === selectedId;

              let bg = "transparent";
              if (conflict) bg = "#F2555F55";
              else if (coveredBy) {
                const p = placements[coveredBy];
                const correctPlacement = isCorrectPlacement(clueById[coveredBy], p);
                const base = clueColor[coveredBy];
                bg = correctPlacement ? base : base.replace("70%)", "88%)");
              }

              const isPending = pendingCorner && pendingCorner.r === r && pendingCorner.c === c;

              const rightId = c + 1 < COLS ? (coverage[r][c + 1][0] ?? null) : "edge";
              const downId = r + 1 < ROWS ? (coverage[r + 1][c][0] ?? null) : "edge";
              const thisId = coveringIds[0] ?? null;
              const rightBorder = rightId !== thisId ? "2px solid #A79CD9" : "1px solid #EDEAF7";
              const bottomBorder = downId !== thisId ? "2px solid #A79CD9" : "1px solid #EDEAF7";

              return (
                <button key={`${r}-${c}`} role="gridcell"
                  aria-label={clue ? `Row ${r + 1} column ${c + 1}, clue ${clue.area}` : `Row ${r + 1} column ${c + 1}`}
                  className="pc-cell pc-btn" onClick={() => handleCellClick(r, c)}
                  style={{
                    width: CELL, height: CELL, fontFamily: "'Baloo 2', sans-serif",
                    fontSize: CELL >= 38 ? 16 : 14, fontWeight: 700, border: "1px solid #E4E0F5",
                    borderRight: rightBorder, borderBottom: bottomBorder, background: bg,
                    outline: isSelected ? "3px solid #5B8DEF" : isPending ? "3px dashed #F2994A" : "none",
                    outlineOffset: "-2px", color: "#2E2B45", padding: 0,
                  }}>
                  {clue ? clue.area : ""}
                </button>
              );
            })
          )}
        </div>
      </div>

      <div style={{ fontSize: 12, opacity: 0.55, marginTop: 14, textAlign: "center", maxWidth: 460 }}>
        Tap a number to select it, then tap any cell as one corner and another
        cell as the opposite corner — the rectangle just needs to contain its
        number somewhere inside, not at a corner. Tap the number again to
        redo it. Backspace/Delete clears the selected rectangle, Escape deselects.
      </div>

      {won && (
        <div style={{
          marginTop: 18, padding: "10px 20px", borderRadius: 10,
          background: "#3DCB8622", border: "1px solid #2FA46A", color: "#2FA46A",
          fontWeight: 700, fontFamily: "'Baloo 2', sans-serif", textAlign: "center",
        }}>
          Solved in {formatTime(finalTime ?? elapsed)} with {wrongMoves} wrong move
          {wrongMoves === 1 ? "" : "s"}! 🎉
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Parcel />);
</script>
</body>
</html>
